apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-mongodb-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  clusterIP: None
  publishNotReadyAddresses: true    # ⬅️ important for StatefulSets

  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
  - name: mongodb
    port: 27017
    targetPort: 27017
    protocol: TCP